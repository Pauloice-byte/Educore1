<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduCore | Autonomous Learning Platform</title>

    <meta
        name="description"
        content="EduCore autonomous learning platform. Learn through structured courses, AI support and expert teaching."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>


    <!-- =====================================================
         MOBILE BACKDROP
    ====================================================== -->

    <div
        class="sidebar-backdrop"
        id="sidebarBackdrop"
    ></div>



    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="sidebar-brand">

            <img
                src="images/logo.jpg"
                alt="EduCore"
                class="logo"
            >

            <div class="brand-information">

                <div class="brand-name">
                    EduCore
                </div>

                <div class="brand-name">
                    Learning
                </div>

                <div class="brand-subtitle">
                    Autonomous Learning
                </div>

            </div>

        </div>



        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav class="sidebar-navigation">


            <!-- =================================================
                 COURSES
            ================================================== -->

            <div class="navigation-section">

                <div class="navigation-heading">
                    COURSES
                </div>


                <button
                    class="navigation-button active"
                    data-filter="all"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ◈
                    </span>

                    <span>
                        All Courses
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="language"
                    type="button"
                >

                    <span class="navigation-symbol">
                        A
                    </span>

                    <span>
                        Language
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="ms-office"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ▣
                    </span>

                    <span>
                        MS Office
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="trading"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ◇
                    </span>

                    <span>
                        Trading
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="technology"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ◉
                    </span>

                    <span>
                        Technology
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="business"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ◆
                    </span>

                    <span>
                        Business
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="finance"
                    type="button"
                >

                    <span class="navigation-symbol">
                        $
                    </span>

                    <span>
                        Finance
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="personal-development"
                    type="button"
                >

                    <span class="navigation-symbol">
                        +
                    </span>

                    <span>
                        Personal Development
                    </span>

                </button>

            </div>



            <!-- =================================================
                 LEARNING MODES
            ================================================== -->

            <div class="navigation-section">

                <div class="navigation-heading">
                    LEARNING MODE
                </div>


                <button
                    class="navigation-button"
                    data-filter="autonomous"
                    type="button"
                >

                    <span class="navigation-symbol">
                        AI
                    </span>

                    <span>
                        Autonomous
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="blended"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ◐
                    </span>

                    <span>
                        Blended
                    </span>

                </button>


                <button
                    class="navigation-button"
                    data-filter="guided"
                    type="button"
                >

                    <span class="navigation-symbol">
                        ●
                    </span>

                    <span>
                        Guided
                    </span>

                </button>

            </div>

        </nav>



        <!-- =================================================
             SIDEBAR FOOTER
        ================================================== -->

        <div class="sidebar-footer">

            <div class="sidebar-footer-line"></div>

            <div>
                EDUCORE
            </div>

            <small>
                Autonomous Learning Platform
            </small>

        </div>

    </aside>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main
        class="main"
        id="main"
    >


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="top-header">


            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Toggle navigation"
                aria-controls="sidebar"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


            <div class="header-title">

                <span>
                    EDUCORE
                </span>

                <strong>
                    Autonomous Learning
                </strong>

            </div>


            <div class="header-status">

                <span class="online-dot"></span>

                <span>
                    Platform Online
                </span>

            </div>


            <!-- LOGIN -->

            <a
                href="login.html"
                class="header-login"
                style="
                    margin-left: 25px;
                    padding: 9px 17px;
                    border: 1px solid #e1e2e6;
                    border-radius: 9px;
                    background: white;
                    color: #20242c;
                    font-size: 11px;
                    font-weight: 700;
                    white-space: nowrap;
                "
            >
                Log in
            </a>

        </header>



        <!-- =================================================
             HERO
        ================================================== -->

        <section class="hero">


            <div
                class="hero-background-circle circle-one"
            ></div>

            <div
                class="hero-background-circle circle-two"
            ></div>


            <div class="hero-content">
