```yaml
name: Build EduCore Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EduCore
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare EduCore
        run: mkdir -p www && cp index.html login.html register.html student.html admin.html www/ && cp -r css js images course-platform www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync EduCore
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build EduCore APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload EduCore APK
        uses: actions/upload-artifact@v4
        with:
          name: EduCore-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
```
